<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Ukrainian Railroad Manager
    </title>
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <script
            src="https://unpkg.com/leaflet/dist/leaflet.js">
    </script>
    <link
            rel="stylesheet" href="RussianRailRoads.css"
    />

</head>

<body>

<!-- MAIN GRAPH AREA -->

<div id="graph-container">

    <!--
        Graph library renders here.
    -->

    <div id="network">
    </div>

</div>


<!-- TOP TOOLBAR -->

<div id="toolbar">

    <button data-view="map">

        Map

    </button>

    <button data-view="matrix">

        Matrix

    </button>

    <button data-view="list">

        List

    </button>

</div>


<!-- SERVER STATUS -->

<div id="status-panel">

    <div>

        Server:
        <span id="server-status">

                Connecting...

            </span>

    </div>

</div>


<!-- FLOATING ACTION BUTTON -->

<div id="fab-container">

    <div id="fab-menu">

        <button id="new-oblast-btn">

            Add Oblast

        </button>

        <button id="new-railroad-btn">

            Add Railroad

        </button>

        <button id="algorithms-btn">

            Algorithms

        </button>

        <button id="visualizations-btn">

            Visualizations

        </button>

    </div>

    <button id="fab">

        +

    </button>

</div>


<!-- ALGORITHM MENU -->

<div id="algorithm-panel">

    <h3>

        Algorithms

    </h3>

    <button data-algorithm="bfs">

        Breadth First Search

    </button>

    <button data-algorithm="dfs">

        Depth First Search

    </button>

    <button data-algorithm="dijkstra">

        Dijkstra

    </button>

    <button data-algorithm="prim">

        Prim

    </button>

    <button data-algorithm="kruskal">

        Kruskal

    </button>

</div>


<!-- ROUTE PANEL -->

<div id="route-panel">

    <h3>

        Route Configuration

    </h3>

    <label>

        Origin

    </label>

    <select id="source-node">

    </select>

    <label>

        Destination

    </label>

    <select id="destination-node">

    </select>

    <button id="run-route-btn">

        Run

    </button>

</div>


<!-- NEW OBLAST -->

<div class="modal"
     id="oblast-modal">

    <div class="modal-content">

        <h3>

            Add Oblast

        </h3>

        <input
                id="oblast-name"
                placeholder="Oblast name">

        <button
                id="save-oblast">

            Save

        </button>

    </div>

</div>


<!-- NEW RAILROAD -->

<div class="modal"
     id="railroad-modal">

    <div class="modal-content">

        <h3>

            Add Railroad

        </h3>

        <select id="railroad-from">

        </select>

        <select id="railroad-to">

        </select>

        <input
                id="railroad-distance"
                type="number"
                placeholder="Distance (km)">

        <button
                id="save-railroad">

            Save

        </button>

    </div>

</div>


<!-- RIGHT CLICK MENU -->

<div id="context-menu">

    <button id="rename-node">

        Rename

    </button>

    <button id="edit-distance">

        Edit Distance

    </button>

    <button id="delete-item">

        Delete

    </button>

    <button id="set-origin">

        Set Origin

    </button>

    <button id="set-destination">

        Set Destination

    </button>

</div>


<!-- NOTIFICATION AREA -->

<div id="toast-container">

</div>


RussianRailRoad.jsscript>

</body>

</html>
